name: nexus_chat
description: NexusChat – Professional Social Media Platform APK

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3+1

  # Socket.io real-time messaging
  socket_io_client: ^2.0.3+1

  # State management
  provider: ^6.1.2

  # Local storage / secure storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Image handling
  cached_network_image: ^3.3.1
  image_picker: ^1.1.1
  image_cropper: ^7.0.3

  # File picker
  file_picker: ^8.0.3

  # Audio / Video
  just_audio: ^0.9.39
  video_player: ^2.8.6

  # Emoji picker
  emoji_picker_flutter: ^2.1.0

  # Time formatting
  timeago: ^3.6.1

  # Notifications
  flutter_local_notifications: ^17.1.2

  # Icons8 / Material icons (SVG support)
  flutter_svg: ^2.0.10+1

  # Connectivity check
  connectivity_plus: ^6.0.3

  # Permission handler
  permission_handler: ^11.3.1

  # URL launcher
  url_launcher: ^6.3.0

  # Intl (date formatting)
  intl: ^0.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: NexusFont
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
